# AIC 2026 Competition Rules Parameters

competition:
  name: "AIC 2026 Video Retrieval"
  max_submission_items: 100
  k_eval_points: [1, 5, 20, 50, 100]
  tasks:
    - name: "Textual KIS"
      format: "video_id,frame_id"
    - name: "Q&A"
      format: "video_id,frame_id,answer_text"
    - name: "TRAKE"
      format: "video_id,event_sequence[frame_ids]"
